[project]
name = "zam-ai-core-api"
version = "0.1.0"
description = "Internal AI API service for Zamda Health's Zam AI platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "pydantic-settings>=2.3.0",
    "uvicorn[standard]>=0.30.0",
    "pypdf>=4.2.0",
    "sqlmodel>=0.0.19",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

