[project]
name = "zam-ai-core-api"
version = "0.1.0"
description = "Internal AI API service for Zamda Health's Zam AI platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "pydantic-settings>=2.3.0",
    "uvicorn[standard]>=0.30.0",
    "pypdf>=4.2.0",
    "sqlmodel>=0.0.19",
    "openpyxl>=3.1.5",
    "llama-index-core>=0.14.0",
    "llama-index-embeddings-voyageai>=0.6.0",
    "llama-index-embeddings-jinaai>=0.6.0",
    "llama-index-embeddings-gemini>=0.4.0",
    "llama-index-vector-stores-pinecone>=0.8.0",
    "qdrant-client>=1.18.0",
    "anthropic>=0.45.0",
    "google-genai>=1.0.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

